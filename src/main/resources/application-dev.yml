spring:
  application:
    name: documentmind
    
  datasource:
    url: jdbc:postgresql://localhost:15432/docmind
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ""
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        extra-body:                                                                                                                    
          include_reasoning: false
        # temperature: 0.5

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# App configurations 
app:
  rag:
    chunk-size: 600
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"
